<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Banco de Alimentos Comarcal de Valparaíso: recogida, almacenamiento y distribución de alimentos a personas y familias en situación de vulnerabilidad. Contacta con nosotros."
    />
    <title>Banco de Alimentos Comarcal · Valparaíso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Formulario oculto solo para que Netlify lo detecte durante el build
      (las SPA no renderizan un <form> estático, así que Netlify no lo vería
      sin esta copia). El formulario real que ve la persona usuaria vive en
      contact-form.tsx y envía los mismos campos por fetch.
    -->
    <form name="contacto" data-netlify="true" netlify-honeypot="empresa" hidden>
      <input type="text" name="nombre" />
      <input type="tel" name="telefono" />
      <input type="email" name="correo" />
      <input type="text" name="motivo" />
      <textarea name="mensaje"></textarea>
      <input type="text" name="empresa" />
    </form>
  </body>
</html>
